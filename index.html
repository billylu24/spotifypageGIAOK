<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Spotify Status</title>

  <style>
    :root {
      --bg: rgba(182, 220, 255, 0.90);
      --bg-glow-a: rgba(255, 255, 255, 0.38);
      --bg-glow-b: rgba(113, 184, 255, 0.28);

      --panel: rgba(237, 247, 255, 0.66);
      --panel-strong: rgba(255, 255, 255, 0.30);
      --line: rgba(255, 255, 255, 0.42);

      --text: rgba(38, 58, 78, 0.98);
      --muted: rgba(74, 95, 115, 0.78);

      --accent: #1ed760;
      --accent-soft: rgba(30, 215, 96, 0.28);

      --btn: rgba(78, 151, 236, 0.84);
      --btn-hover: rgba(61, 132, 220, 0.98);
      --danger: rgba(220, 80, 80, 0.9);

      --shadow: 0 14px 30px rgba(22, 60, 100, 0.16);
      --inner-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55);

      --cover-size: 82px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font-family: "Segoe UI", "Inter", Arial, sans-serif;
    }

    body {
      padding: 6px;
    }

    .spotify-app {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;

      position: relative;
      isolation: isolate;

      background:
        radial-gradient(circle at 16% 8%, var(--bg-glow-a), transparent 36%),
        radial-gradient(circle at 92% 85%, var(--bg-glow-b), transparent 42%),
        linear-gradient(145deg, rgba(228, 244, 255, 0.92), var(--bg));

      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow), var(--inner-shadow);

      display: grid;
      grid-template-rows: 28px minmax(0, 1fr);
      gap: 6px;

      padding: 8px;
      overflow: hidden;
      backdrop-filter: blur(16px) saturate(1.22);
      -webkit-backdrop-filter: blur(16px) saturate(1.22);
    }

    .spotify-app::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(
          115deg,
          rgba(255, 255, 255, 0.30),
          transparent 34%,
          rgba(255, 255, 255, 0.10) 62%,
          transparent
        );
    }

    .spotify-app::after {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      top: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.72);
      opacity: 0.8;
      pointer-events: none;
    }

    .topbar {
      min-height: 0;
      height: 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      overflow: hidden;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand-mark {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.65), transparent 30%),
        linear-gradient(145deg, #26ef75, var(--accent));
      position: relative;
      flex: 0 0 auto;
      box-shadow:
        0 5px 12px rgba(30, 215, 96, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .brand-mark span {
      position: absolute;
      left: 18%;
      right: 18%;
      height: 8%;
      border-radius: 999px;
      background: white;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.45);
    }

    .brand-mark span:nth-child(1) {
      top: 28%;
      transform: rotate(8deg);
    }

    .brand-mark span:nth-child(2) {
      top: 43%;
      left: 23%;
      right: 23%;
      transform: rotate(8deg);
      opacity: 0.88;
    }

    .brand-mark span:nth-child(3) {
      top: 57%;
      left: 28%;
      right: 28%;
      transform: rotate(8deg);
      opacity: 0.78;
    }

    .brand-copy {
      min-width: 0;
      overflow: hidden;
    }

    .brand-title {
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.42);
    }

    .brand-subtitle {
      display: none;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: 0 0 auto;
      min-width: 0;
    }

    .status-pill {
      height: 22px;
      padding: 0 7px;
      border-radius: 999px;

      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.20));
      border: 1px solid rgba(255, 255, 255, 0.38);

      color: var(--muted);
      font-size: 9px;
      font-weight: 800;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;

      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .btn {
      height: 22px;
      padding: 0 8px;
      border: none;
      border-radius: 8px;

      background:
        linear-gradient(180deg, rgba(103, 173, 246, 0.96), var(--btn));
      color: white;

      font-size: 9px;
      font-weight: 900;
      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease,
        opacity 0.15s ease;

      white-space: nowrap;
      box-shadow:
        0 4px 10px rgba(55, 130, 210, 0.20),
        inset 0 1px 0 rgba(255, 255, 255, 0.38);
    }

    .btn:hover {
      background:
        linear-gradient(180deg, rgba(92, 160, 238, 1), var(--btn-hover));
      transform: translateY(-1px);
      box-shadow:
        0 7px 14px rgba(55, 130, 210, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.42);
    }

    .btn:active {
      transform: translateY(0);
      opacity: 0.92;
    }

    .btn.ghost {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.20));
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.32);
    }

    .btn.ghost:hover {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.48), rgba(255, 255, 255, 0.26));
    }

    .btn.danger {
      background:
        linear-gradient(180deg, rgba(235, 105, 105, 0.96), var(--danger));
    }

    .main {
      min-width: 0;
      min-height: 0;

      position: relative;

      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.54), var(--panel));
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 16px;

      display: grid;
      grid-template-columns: var(--cover-size) minmax(0, 1fr);
      gap: 10px;
      align-items: center;

      padding: 10px;
      overflow: hidden;

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.58),
        0 7px 18px rgba(33, 76, 120, 0.10);
    }

    .main::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 20%, rgba(255, 255, 255, 0.42), transparent 36%),
        radial-gradient(circle at 100% 100%, rgba(30, 215, 96, 0.10), transparent 42%);
      opacity: 0.95;
    }

    .cover {
      width: var(--cover-size);
      height: var(--cover-size);
      border-radius: 13px;

      position: relative;
      z-index: 1;

      object-fit: cover;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.38), rgba(202, 226, 247, 0.42));

      box-shadow:
        0 9px 20px rgba(17, 52, 88, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.38);

      opacity: 0;
      transition:
        opacity 0.2s ease,
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    .cover.ready {
      opacity: 1;
    }

    .spotify-app.is-playing .cover.ready {
      box-shadow:
        0 10px 24px rgba(17, 52, 88, 0.20),
        0 0 0 1px rgba(255, 255, 255, 0.30),
        0 0 18px rgba(30, 215, 96, 0.16);
    }

    .track {
      min-width: 0;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .state-line {
      font-size: 9px;
      font-weight: 900;
      line-height: 1;
      color: var(--muted);
      margin-bottom: 5px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .title {
      font-size: 15px;
      font-weight: 950;
      line-height: 1.08;
      letter-spacing: -0.015em;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;

      overflow: hidden;
      word-break: break-word;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.42);
    }

    .artist {
      margin-top: 5px;
      font-size: 11px;
      line-height: 1.15;
      color: var(--muted);
      font-weight: 650;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .album {
      display: none;
    }

    .beat-visualizer {
      margin-top: 7px;
      height: 18px;
      width: 100%;

      display: flex;
      align-items: center;
      gap: 3px;

      overflow: hidden;
      opacity: 0.95;
    }

    .beat-bar {
      width: 3px;
      height: 7px;
      flex: 0 0 3px;

      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(30, 215, 96, 0.95), rgba(61, 132, 220, 0.72));
      box-shadow:
        0 0 8px rgba(30, 215, 96, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.42);

      transform-origin: center;
      animation: beatIdle 1.6s ease-in-out infinite;
    }

    .beat-bar:nth-child(1) { animation-delay: -0.10s; }
    .beat-bar:nth-child(2) { animation-delay: -0.32s; }
    .beat-bar:nth-child(3) { animation-delay: -0.54s; }
    .beat-bar:nth-child(4) { animation-delay: -0.18s; }
    .beat-bar:nth-child(5) { animation-delay: -0.42s; }
    .beat-bar:nth-child(6) { animation-delay: -0.68s; }
    .beat-bar:nth-child(7) { animation-delay: -0.24s; }
    .beat-bar:nth-child(8) { animation-delay: -0.48s; }
    .beat-bar:nth-child(9) { animation-delay: -0.74s; }
    .beat-bar:nth-child(10) { animation-delay: -0.28s; }
    .beat-bar:nth-child(11) { animation-delay: -0.58s; }
    .beat-bar:nth-child(12) { animation-delay: -0.80s; }
    .beat-bar:nth-child(13) { animation-delay: -0.36s; }
    .beat-bar:nth-child(14) { animation-delay: -0.64s; }
    .beat-bar:nth-child(15) { animation-delay: -0.86s; }
    .beat-bar:nth-child(16) { animation-delay: -0.44s; }

    .spotify-app.is-playing .beat-bar {
      animation-name: beatPlaying;
      animation-duration: 0.74s;
      animation-timing-function: cubic-bezier(0.22, 0.72, 0.22, 1);
    }

    .spotify-app.is-paused .beat-bar,
    .spotify-app.is-idle .beat-bar,
    .spotify-app.is-error .beat-bar {
      animation-name: beatIdle;
      animation-duration: 1.9s;
      opacity: 0.45;
      background:
        linear-gradient(180deg, rgba(120, 160, 200, 0.65), rgba(90, 125, 160, 0.46));
      box-shadow: none;
    }

    .progress-wrap {
      margin-top: 7px;
      width: 100%;
    }

    .progress-row {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 30px;
      gap: 6px;
      align-items: center;
    }

    .time {
      font-size: 8px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: center;
      line-height: 1;
      font-weight: 750;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;

      width: 100%;
      height: 5px;
      border-radius: 999px;
      background:
        linear-gradient(90deg, rgba(30, 215, 96, 0.52), rgba(80, 150, 230, 0.40)),
        rgba(255, 255, 255, 0.45);

      pointer-events: none;
      box-shadow:
        inset 0 1px 2px rgba(42, 75, 105, 0.08),
        0 1px 0 rgba(255, 255, 255, 0.44);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;

      width: 10px;
      height: 10px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.16) 34%),
        rgba(68, 138, 220, 1);
      border: none;
      box-shadow:
        0 1px 6px rgba(68, 138, 220, 0.45),
        0 0 0 2px rgba(255, 255, 255, 0.42);
    }

    input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: rgba(68, 138, 220, 1);
      border: none;
      box-shadow:
        0 1px 6px rgba(68, 138, 220, 0.45),
        0 0 0 2px rgba(255, 255, 255, 0.42);
    }

    @keyframes beatPlaying {
      0% {
        transform: scaleY(0.45);
      }

      16% {
        transform: scaleY(1.65);
      }

      34% {
        transform: scaleY(0.75);
      }

      52% {
        transform: scaleY(1.28);
      }

      72% {
        transform: scaleY(0.58);
      }

      100% {
        transform: scaleY(0.45);
      }
    }

    @keyframes beatIdle {
      0% {
        transform: scaleY(0.42);
      }

      50% {
        transform: scaleY(0.78);
      }

      100% {
        transform: scaleY(0.42);
      }
    }

    /*
      Ultra narrow mode.
      This handles thin side panels or iframe widths below 330px.
    */
    @media (max-width: 330px) {
      :root {
        --cover-size: 64px;
      }

      body {
        padding: 5px;
      }

      .spotify-app {
        padding: 7px;
        gap: 5px;
        border-radius: 18px;
      }

      .main {
        grid-template-columns: var(--cover-size) minmax(0, 1fr);
        gap: 8px;
        padding: 8px;
        border-radius: 14px;
      }

      .brand-mark {
        width: 20px;
        height: 20px;
      }

      .brand-title {
        font-size: 10px;
      }

      .status-pill {
        display: none;
      }

      .btn {
        height: 21px;
        padding: 0 7px;
        font-size: 8px;
      }

      .title {
        font-size: 13px;
        line-height: 1.06;
      }

      .artist {
        font-size: 10px;
        margin-top: 4px;
      }

      .beat-visualizer {
        height: 16px;
        gap: 2px;
        margin-top: 6px;
      }

      .beat-bar {
        width: 2px;
        flex-basis: 2px;
      }

      .progress-wrap {
        margin-top: 6px;
      }

      .progress-row {
        grid-template-columns: 27px minmax(0, 1fr) 27px;
        gap: 5px;
      }
    }

    /*
      Very short visual container fallback.
      This still exists, but the base layout is already compact,
      so it does not depend on this triggering.
    */
    @media (max-height: 170px) {
      :root {
        --cover-size: 58px;
      }

      body {
        padding: 4px;
      }

      .spotify-app {
        grid-template-rows: 24px minmax(0, 1fr);
        padding: 6px;
        gap: 4px;
        border-radius: 16px;
      }

      .topbar {
        height: 24px;
      }

      .brand-mark {
        width: 18px;
        height: 18px;
      }

      .brand-title {
        font-size: 10px;
      }

      .main {
        padding: 7px;
        gap: 8px;
        border-radius: 13px;
      }

      .state-line {
        display: none;
      }

      .title {
        font-size: 12px;
        -webkit-line-clamp: 1;
      }

      .artist {
        font-size: 9px;
      }

      .beat-visualizer {
        height: 13px;
        margin-top: 4px;
      }

      .progress-wrap {
        margin-top: 5px;
      }

      .time {
        font-size: 7px;
      }

      input[type="range"] {
        height: 4px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .beat-bar,
      .btn,
      .cover {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="spotify-app is-idle" id="spotify-app">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="brand-copy">
          <div class="brand-title">Spotify Status</div>
          <div class="brand-subtitle" id="subtitle">Connect to view current playback</div>
        </div>
      </div>

      <div class="topbar-actions">
        <div class="status-pill" id="status-pill">Not connected</div>
        <button class="btn" id="login-btn" type="button">Connect</button>
        <button class="btn ghost" id="refresh-btn" type="button" style="display: none;">Refresh</button>
        <button class="btn danger" id="logout-btn" type="button" style="display: none;">Logout</button>
      </div>
    </div>

    <div class="main">
      <img
        id="cover"
        class="cover"
        alt="Album cover"
        src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="
      />

      <div class="track">
        <div class="state-line" id="state-line">Waiting for Spotify login</div>
        <div class="title" id="track-title">Nothing playing</div>
        <div class="artist" id="track-artist">Connect Spotify first.</div>
        <div class="album" id="track-album"></div>

        <div class="beat-visualizer" id="beat-visualizer" aria-hidden="true">
          <span class="beat-bar"></span>
          <span class="beat-bar"></span>
          <span class="beat-bar"></span>
          <span class="beat-bar"></span>
          <span class="beat-bar"></span>
          <span class="beat-bar"></span>
          <span class="beat-bar"></span>
          <span class="beat-bar"></span>
          <span class="beat-bar"></span>
          <span class="beat-bar"></span>
          <span class="beat-bar"></span>
          <span class="beat-bar"></span>
          <span class="beat-bar"></span>
          <span class="beat-bar"></span>
          <span class="beat-bar"></span>
          <span class="beat-bar"></span>
        </div>

        <div class="progress-wrap">
          <div class="progress-row">
            <div class="time" id="current-time">0:00</div>
            <input id="progress" type="range" min="0" max="1000" value="0" readonly />
            <div class="time" id="duration-time">0:00</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DEBUG = false;

    const SPOTIFY_CLIENT_ID = 'ebf76017bcc54b1aaca01ed3fa4c161d';
    const REDIRECT_URI = 'https://billylu24.github.io/spotifypageGIAOK/';

    const SPOTIFY_SCOPES = [
      'user-read-email',
      'user-read-private',
      'user-read-playback-state',
      'user-read-currently-playing'
    ].join(' ');

    const AUTH_KEY = 'p3r_spotify_status_auth_v2';
    const VERIFIER_KEY = 'p3r_spotify_status_verifier_v2';
    const STATE_KEY = 'p3r_spotify_status_state_v2';

    const els = {
      app: document.getElementById('spotify-app'),

      subtitle: document.getElementById('subtitle'),
      statusPill: document.getElementById('status-pill'),
      loginBtn: document.getElementById('login-btn'),
      refreshBtn: document.getElementById('refresh-btn'),
      logoutBtn: document.getElementById('logout-btn'),

      cover: document.getElementById('cover'),
      stateLine: document.getElementById('state-line'),
      title: document.getElementById('track-title'),
      artist: document.getElementById('track-artist'),
      album: document.getElementById('track-album'),
      progress: document.getElementById('progress'),
      currentTime: document.getElementById('current-time'),
      durationTime: document.getElementById('duration-time')
    };

    let pollTimer = null;
    let tickerTimer = null;

    let isPlaying = false;
    let progressBase = 0;
    let progressDuration = 0;
    let progressStartedAt = 0;

    function debug(message, type = 'info', data = undefined) {
      if (!DEBUG) return;

      const line = `[Spotify Status] ${message}`;

      if (type === 'error') {
        console.error(line, data ?? '');
      } else if (type === 'warn') {
        console.warn(line, data ?? '');
      } else {
        console.log(line, data ?? '');
      }
    }

    function setStatus(text) {
      els.statusPill.textContent = text;
      debug(`STATUS: ${text}`);
    }

    function setSubtitle(text) {
      els.subtitle.textContent = text;
      debug(`SUBTITLE: ${text}`);
    }

    function setBeatState(state) {
      els.app.classList.remove('is-playing', 'is-paused', 'is-idle', 'is-error');

      if (state === 'playing') {
        els.app.classList.add('is-playing');
      } else if (state === 'paused') {
        els.app.classList.add('is-paused');
      } else if (state === 'error') {
        els.app.classList.add('is-error');
      } else {
        els.app.classList.add('is-idle');
      }
    }

    function getAuth() {
      try {
        return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
      } catch (err) {
        debug('Failed to parse auth from localStorage', 'error', err.message);
        return null;
      }
    }

    function saveAuth(auth) {
      localStorage.setItem(AUTH_KEY, JSON.stringify(auth));
    }

    function clearAuth() {
      localStorage.removeItem(AUTH_KEY);
      sessionStorage.removeItem(VERIFIER_KEY);
      sessionStorage.removeItem(STATE_KEY);
    }

    function randomString(len = 64) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const arr = crypto.getRandomValues(new Uint8Array(len));
      let out = '';

      for (let i = 0; i < len; i++) {
        out += chars[arr[i] % chars.length];
      }

      return out;
    }

    async function sha256(plain) {
      const data = new TextEncoder().encode(plain);
      return crypto.subtle.digest('SHA-256', data);
    }

    function base64UrlEncode(arrayBuffer) {
      return btoa(String.fromCharCode(...new Uint8Array(arrayBuffer)))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/g, '');
    }

    async function loginSpotify() {
      const verifier = randomString(96);
      const state = randomString(24);
      const challenge = base64UrlEncode(await sha256(verifier));

      sessionStorage.setItem(VERIFIER_KEY, verifier);
      sessionStorage.setItem(STATE_KEY, state);

      const authUrl = new URL('https://accounts.spotify.com/authorize');

      authUrl.search = new URLSearchParams({
        client_id: SPOTIFY_CLIENT_ID,
        response_type: 'code',
        redirect_uri: REDIRECT_URI,
        code_challenge_method: 'S256',
        code_challenge: challenge,
        scope: SPOTIFY_SCOPES,
        state
      }).toString();

      window.location.href = authUrl.toString();
    }

    async function handleAuthCallback() {
      const params = new URLSearchParams(window.location.search);

      const code = params.get('code');
      const error = params.get('error');
      const state = params.get('state');

      if (error) {
        throw new Error(`Spotify auth error: ${error}`);
      }

      if (!code) {
        return false;
      }

      const expectedState = sessionStorage.getItem(STATE_KEY);
      const verifier = sessionStorage.getItem(VERIFIER_KEY);

      if (!state || state !== expectedState) {
        throw new Error('State mismatch. Session storage may have been lost.');
      }

      if (!verifier) {
        throw new Error('Missing PKCE verifier. Login must be restarted.');
      }

      await exchangeCodeForToken(code, verifier);

      history.replaceState({}, '', REDIRECT_URI);

      return true;
    }

    async function exchangeCodeForToken(code, verifier) {
      const body = new URLSearchParams({
        client_id: SPOTIFY_CLIENT_ID,
        grant_type: 'authorization_code',
        code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      });

      const res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body
      });

      const text = await res.text();

      if (!res.ok) {
        console.error('[Spotify Status] Token exchange failed:', res.status, text);
        throw new Error(`Token exchange failed: HTTP ${res.status}`);
      }

      const json = JSON.parse(text);

      saveAuth({
        access_token: json.access_token,
        refresh_token: json.refresh_token,
        expires_at: Date.now() + Math.max(0, json.expires_in - 60) * 1000,
        scope: json.scope || SPOTIFY_SCOPES
      });

      sessionStorage.removeItem(VERIFIER_KEY);
      sessionStorage.removeItem(STATE_KEY);
    }

    async function refreshAccessToken() {
      const auth = getAuth();

      if (!auth?.refresh_token) {
        throw new Error('No refresh token available');
      }

      const body = new URLSearchParams({
        client_id: SPOTIFY_CLIENT_ID,
        grant_type: 'refresh_token',
        refresh_token: auth.refresh_token
      });

      const res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body
      });

      const text = await res.text();

      if (!res.ok) {
        console.error('[Spotify Status] Refresh failed:', res.status, text);
        clearAuth();
        throw new Error(`Refresh failed: HTTP ${res.status}`);
      }

      const json = JSON.parse(text);

      const next = {
        access_token: json.access_token,
        refresh_token: json.refresh_token || auth.refresh_token,
        expires_at: Date.now() + Math.max(0, json.expires_in - 60) * 1000,
        scope: json.scope || auth.scope || SPOTIFY_SCOPES
      };

      saveAuth(next);

      return next.access_token;
    }

    async function getValidAccessToken() {
      const auth = getAuth();

      if (!auth?.access_token) {
        throw new Error('Not authenticated. No access token in localStorage.');
      }

      if (Date.now() < auth.expires_at) {
        return auth.access_token;
      }

      return refreshAccessToken();
    }

    async function spotifyFetch(path, options = {}) {
      const token = await getValidAccessToken();

      const res = await fetch(`https://api.spotify.com/v1${path}`, {
        ...options,
        headers: {
          Authorization: `Bearer ${token}`,
          ...(options.headers || {})
        }
      });

      if (res.status === 204) {
        return null;
      }

      if (res.status === 401) {
        await refreshAccessToken();

        const retryToken = await getValidAccessToken();

        const retry = await fetch(`https://api.spotify.com/v1${path}`, {
          ...options,
          headers: {
            Authorization: `Bearer ${retryToken}`,
            ...(options.headers || {})
          }
        });

        if (retry.status === 204) {
          return null;
        }

        if (!retry.ok) {
          const text = await retry.text();
          console.error('[Spotify Status] Spotify API retry failed:', retry.status, text);
          throw new Error(`Spotify API retry failed: HTTP ${retry.status}`);
        }

        return retry.json();
      }

      if (!res.ok) {
        const text = await res.text();
        console.error('[Spotify Status] Spotify API failed:', path, res.status, text);
        throw new Error(`Spotify API error for ${path}: HTTP ${res.status}`);
      }

      return res.json();
    }

    async function verifyProfile() {
      const profile = await spotifyFetch('/me');

      setStatus('Connected');
      setSubtitle(`Logged in as ${profile.display_name || profile.id}`);

      return profile;
    }

    async function fetchPlaybackStatus() {
      let playback = null;

      try {
        playback = await spotifyFetch('/me/player');
      } catch (err) {
        console.warn('[Spotify Status] /me/player failed:', err.message);
      }

      if (playback?.item) {
        renderPlayback(playback, 'me/player');
        return;
      }

      let currentlyPlaying = null;

      try {
        currentlyPlaying = await spotifyFetch('/me/player/currently-playing');
      } catch (err) {
        console.warn('[Spotify Status] /me/player/currently-playing failed:', err.message);
      }

      if (currentlyPlaying?.item) {
        renderPlayback(currentlyPlaying, 'currently-playing');
        return;
      }

      renderIdle();
    }

    function formatMs(ms) {
      const totalSeconds = Math.max(0, Math.floor((ms || 0) / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = String(totalSeconds % 60).padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function updateProgressUi(pos, dur) {
      const safeDur = Math.max(0, dur || 0);
      const safePos = Math.max(0, Math.min(pos || 0, safeDur || 0));

      els.currentTime.textContent = formatMs(safePos);
      els.durationTime.textContent = formatMs(safeDur);
      els.progress.max = String(Math.max(1, safeDur));
      els.progress.value = String(safePos);
    }

    function renderIdle() {
      isPlaying = false;
      progressBase = 0;
      progressDuration = 0;
      progressStartedAt = Date.now();

      setBeatState('idle');

      els.cover.src = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
      els.cover.classList.remove('ready');

      els.stateLine.textContent = 'No active playback';
      els.title.textContent = 'Nothing playing';
      els.artist.textContent = 'Open Spotify and play a song on any device.';
      els.album.textContent = '';

      updateProgressUi(0, 0);

      setStatus('Idle');
      setSubtitle('Connected, but Spotify returned no active playback');
    }

    function renderPlayback(data, source) {
      const item = data.item;

      if (!item) {
        renderIdle();
        return;
      }

      const artists = Array.isArray(item.artists)
        ? item.artists.map((a) => a.name).join(', ')
        : 'Unknown artist';

      const album = item.album?.name || '';
      const image = item.album?.images?.[0]?.url || '';

      isPlaying = !!data.is_playing;
      progressBase = data.progress_ms || 0;
      progressDuration = item.duration_ms || 0;
      progressStartedAt = Date.now();

      setBeatState(isPlaying ? 'playing' : 'paused');

      els.stateLine.textContent = isPlaying ? 'Now playing' : 'Paused';
      els.title.textContent = item.name || 'Unknown track';
      els.artist.textContent = artists;
      els.album.textContent = album ? `Album: ${album}` : '';

      if (image) {
        els.cover.src = image;
        els.cover.classList.add('ready');
      } else {
        els.cover.src = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
        els.cover.classList.remove('ready');
      }

      updateProgressUi(progressBase, progressDuration);

      setStatus(isPlaying ? 'Playing' : 'Paused');
      setSubtitle(`Synced by ${source}`);
    }

    function startTicker() {
      if (tickerTimer) {
        clearInterval(tickerTimer);
      }

      tickerTimer = setInterval(() => {
        if (!isPlaying) return;

        const estimatedPosition = progressBase + (Date.now() - progressStartedAt);
        updateProgressUi(estimatedPosition, progressDuration);
      }, 250);
    }

    function startPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
      }

      pollTimer = setInterval(() => {
        fetchPlaybackStatus().catch((err) => {
          console.warn('[Spotify Status] Polling failed:', err.message);
          setBeatState('error');
          setStatus('Poll error');
          setSubtitle(err.message);
        });
      }, 5000);
    }

    function showLoggedInButtons() {
      els.loginBtn.style.display = 'none';
      els.refreshBtn.style.display = 'inline-flex';
      els.logoutBtn.style.display = 'inline-flex';
    }

    function showLoggedOutButtons() {
      els.loginBtn.style.display = 'inline-flex';
      els.refreshBtn.style.display = 'none';
      els.logoutBtn.style.display = 'none';
    }

    els.loginBtn.addEventListener('click', () => {
      loginSpotify().catch((err) => {
        console.error('[Spotify Status] Login failed:', err);
        setBeatState('error');
        setStatus('Login failed');
        setSubtitle(err.message);
      });
    });

    els.refreshBtn.addEventListener('click', () => {
      fetchPlaybackStatus().catch((err) => {
        console.error('[Spotify Status] Manual refresh failed:', err);
        setBeatState('error');
        setStatus('Refresh failed');
        setSubtitle(err.message);
      });
    });

    els.logoutBtn.addEventListener('click', () => {
      clearAuth();
      location.href = REDIRECT_URI;
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && getAuth()) {
        fetchPlaybackStatus().catch((err) => {
          console.warn('[Spotify Status] Visibility refresh failed:', err.message);
        });
      }
    });

    window.addEventListener('focus', () => {
      if (getAuth()) {
        fetchPlaybackStatus().catch((err) => {
          console.warn('[Spotify Status] Focus refresh failed:', err.message);
        });
      }
    });

    (async function init() {
      try {
        setBeatState('idle');

        setStatus('Checking auth');
        setSubtitle('Checking Spotify login state');

        await handleAuthCallback();

        const auth = getAuth();

        if (!auth?.access_token) {
          showLoggedOutButtons();

          setBeatState('idle');

          setStatus('Not connected');
          setSubtitle('Connect Spotify to view current playback');

          els.stateLine.textContent = 'Not connected';
          els.title.textContent = 'Nothing playing';
          els.artist.textContent = 'Click Connect first.';
          els.album.textContent = '';

          updateProgressUi(0, 0);
          return;
        }

        showLoggedInButtons();

        await verifyProfile();
        await fetchPlaybackStatus();

        startTicker();
        startPolling();
      } catch (err) {
        console.error('[Spotify Status] Init failed:', err);

        showLoggedOutButtons();

        setBeatState('error');

        setStatus('Init failed');
        setSubtitle(err.message || 'Check console');

        els.stateLine.textContent = 'Error';
        els.title.textContent = 'Failed to initialize';
        els.artist.textContent = err.message || 'Check console.';
        els.album.textContent = '';
      }
    })();
  </script>
</body>
</html>
