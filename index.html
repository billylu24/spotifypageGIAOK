<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Status</title>

  <style>
    :root {
      --bg: rgba(182, 220, 255, 0.92);
      --panel: rgba(231, 242, 255, 0.72);
      --line: rgba(255, 255, 255, 0.34);
      --text: rgba(53, 73, 92, 0.98);
      --muted: rgba(79, 96, 114, 0.82);
      --accent: #1ed760;
      --btn: rgba(86, 156, 234, 0.82);
      --btn-hover: rgba(68, 138, 220, 0.95);
      --danger: rgba(220, 80, 80, 0.9);
      --shadow: 0 10px 24px rgba(0, 0, 0, 0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "Inter", Arial, sans-serif;
      background: transparent;
      color: var(--text);
    }

    body {
      padding: 12px;
    }

    .spotify-app {
      width: 100%;
      height: 100%;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      padding: 14px;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: var(--accent);
      position: relative;
      flex: 0 0 auto;
    }

    .brand-mark span {
      position: absolute;
      left: 18%;
      right: 18%;
      height: 8%;
      border-radius: 999px;
      background: white;
    }

    .brand-mark span:nth-child(1) {
      top: 28%;
      transform: rotate(8deg);
    }

    .brand-mark span:nth-child(2) {
      top: 43%;
      left: 23%;
      right: 23%;
      transform: rotate(8deg);
      opacity: 0.88;
    }

    .brand-mark span:nth-child(3) {
      top: 57%;
      left: 28%;
      right: 28%;
      transform: rotate(8deg);
      opacity: 0.78;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.05;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .status-pill {
      height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.24);
      color: var(--muted);
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .btn {
      height: 34px;
      padding: 0 12px;
      border: none;
      border-radius: 11px;
      background: var(--btn);
      color: white;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--btn-hover);
      transform: translateY(-1px);
    }

    .btn.ghost {
      background: rgba(255, 255, 255, 0.22);
      color: var(--text);
    }

    .btn.danger {
      background: var(--danger);
    }

    .main {
      min-height: 0;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 22px;
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 18px;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    .cover {
      width: 180px;
      height: 180px;
      border-radius: 22px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.26);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .cover.ready {
      opacity: 1;
    }

    .track {
      min-width: 0;
    }

    .state-line {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .title {
      font-size: 24px;
      font-weight: 900;
      line-height: 1.16;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .artist {
      margin-top: 8px;
      font-size: 15px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .album {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-wrap {
      margin-top: 18px;
      width: 100%;
    }

    .progress-row {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      gap: 10px;
      align-items: center;
    }

    .time {
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.45);
      pointer-events: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: rgba(68, 138, 220, 1);
      border: none;
    }

    input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: rgba(68, 138, 220, 1);
      border: none;
    }

    @media (max-width: 680px) {
      body {
        padding: 8px;
      }

      .spotify-app {
        border-radius: 22px;
        padding: 12px;
      }

      .main {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
        padding: 16px;
      }

      .cover {
        width: 145px;
        height: 145px;
      }

      .status-pill {
        display: none;
      }

      .title {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="spotify-app">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="brand-copy">
          <div class="brand-title">Spotify Status</div>
          <div class="brand-subtitle" id="subtitle">Connect to view current playback</div>
        </div>
      </div>

      <div class="topbar-actions">
        <div class="status-pill" id="status-pill">Not connected</div>
        <button class="btn" id="login-btn" type="button">Connect</button>
        <button class="btn ghost" id="refresh-btn" type="button" style="display: none;">Refresh</button>
        <button class="btn danger" id="logout-btn" type="button" style="display: none;">Logout</button>
      </div>
    </div>

    <div class="main">
      <img
        id="cover"
        class="cover"
        alt="Album cover"
        src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="
      />

      <div class="track">
        <div class="state-line" id="state-line">Waiting for Spotify login</div>
        <div class="title" id="track-title">Nothing playing</div>
        <div class="artist" id="track-artist">Connect Spotify first.</div>
        <div class="album" id="track-album"></div>

        <div class="progress-wrap">
          <div class="progress-row">
            <div class="time" id="current-time">0:00</div>
            <input id="progress" type="range" min="0" max="1000" value="0" readonly />
            <div class="time" id="duration-time">0:00</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /******************************************************************
     * CONFIG
     ******************************************************************/

    const DEBUG = false;

    const SPOTIFY_CLIENT_ID = 'ebf76017bcc54b1aaca01ed3fa4c161d';

    const REDIRECT_URI = 'https://billylu24.github.io/spotifypageGIAOK/';

    const SPOTIFY_SCOPES = [
      'user-read-email',
      'user-read-private',
      'user-read-playback-state',
      'user-read-currently-playing'
    ].join(' ');

    const AUTH_KEY = 'p3r_spotify_status_auth_v2';
    const VERIFIER_KEY = 'p3r_spotify_status_verifier_v2';
    const STATE_KEY = 'p3r_spotify_status_state_v2';

    /******************************************************************
     * DOM
     ******************************************************************/

    const els = {
      subtitle: document.getElementById('subtitle'),
      statusPill: document.getElementById('status-pill'),
      loginBtn: document.getElementById('login-btn'),
      refreshBtn: document.getElementById('refresh-btn'),
      logoutBtn: document.getElementById('logout-btn'),

      cover: document.getElementById('cover'),
      stateLine: document.getElementById('state-line'),
      title: document.getElementById('track-title'),
      artist: document.getElementById('track-artist'),
      album: document.getElementById('track-album'),
      progress: document.getElementById('progress'),
      currentTime: document.getElementById('current-time'),
      durationTime: document.getElementById('duration-time')
    };

    /******************************************************************
     * STATE
     ******************************************************************/

    let pollTimer = null;
    let tickerTimer = null;

    let isPlaying = false;
    let progressBase = 0;
    let progressDuration = 0;
    let progressStartedAt = 0;

    /******************************************************************
     * LOGGING
     ******************************************************************/

    function debug(message, type = 'info', data = undefined) {
      if (!DEBUG) return;

      const line = `[Spotify Status] ${message}`;

      if (type === 'error') {
        console.error(line, data ?? '');
      } else if (type === 'warn') {
        console.warn(line, data ?? '');
      } else {
        console.log(line, data ?? '');
      }
    }

    function setStatus(text) {
      els.statusPill.textContent = text;
      debug(`STATUS: ${text}`);
    }

    function setSubtitle(text) {
      els.subtitle.textContent = text;
      debug(`SUBTITLE: ${text}`);
    }

    /******************************************************************
     * AUTH STORAGE
     ******************************************************************/

    function getAuth() {
      try {
        return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
      } catch (err) {
        debug('Failed to parse auth from localStorage', 'error', err.message);
        return null;
      }
    }

    function saveAuth(auth) {
      localStorage.setItem(AUTH_KEY, JSON.stringify(auth));

      debug('Saved auth tokens to localStorage', 'ok', {
        hasAccessToken: !!auth.access_token,
        hasRefreshToken: !!auth.refresh_token,
        expiresAt: new Date(auth.expires_at).toISOString()
      });
    }

    function clearAuth() {
      localStorage.removeItem(AUTH_KEY);
      sessionStorage.removeItem(VERIFIER_KEY);
      sessionStorage.removeItem(STATE_KEY);
      debug('Cleared auth/session storage', 'warn');
    }

    /******************************************************************
     * PKCE HELPERS
     ******************************************************************/

    function randomString(len = 64) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const arr = crypto.getRandomValues(new Uint8Array(len));
      let out = '';

      for (let i = 0; i < len; i++) {
        out += chars[arr[i] % chars.length];
      }

      return out;
    }

    async function sha256(plain) {
      const data = new TextEncoder().encode(plain);
      return crypto.subtle.digest('SHA-256', data);
    }

    function base64UrlEncode(arrayBuffer) {
      return btoa(String.fromCharCode(...new Uint8Array(arrayBuffer)))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/g, '');
    }

    /******************************************************************
     * SPOTIFY AUTH
     ******************************************************************/

    async function loginSpotify() {
      debug('Starting Spotify PKCE login');

      const verifier = randomString(96);
      const state = randomString(24);
      const challenge = base64UrlEncode(await sha256(verifier));

      sessionStorage.setItem(VERIFIER_KEY, verifier);
      sessionStorage.setItem(STATE_KEY, state);

      const authUrl = new URL('https://accounts.spotify.com/authorize');

      authUrl.search = new URLSearchParams({
        client_id: SPOTIFY_CLIENT_ID,
        response_type: 'code',
        redirect_uri: REDIRECT_URI,
        code_challenge_method: 'S256',
        code_challenge: challenge,
        scope: SPOTIFY_SCOPES,
        state
      }).toString();

      window.location.href = authUrl.toString();
    }

    async function handleAuthCallback() {
      const params = new URLSearchParams(window.location.search);

      const code = params.get('code');
      const error = params.get('error');
      const state = params.get('state');

      debug('Checking auth callback', 'info', {
        hasCode: !!code,
        error,
        returnedState: state,
        currentUrl: window.location.href
      });

      if (error) {
        throw new Error(`Spotify auth error: ${error}`);
      }

      if (!code) {
        return false;
      }

      const expectedState = sessionStorage.getItem(STATE_KEY);
      const verifier = sessionStorage.getItem(VERIFIER_KEY);

      if (!state || state !== expectedState) {
        throw new Error('State mismatch. Session storage may have been lost.');
      }

      if (!verifier) {
        throw new Error('Missing PKCE verifier. Login must be restarted.');
      }

      await exchangeCodeForToken(code, verifier);

      history.replaceState({}, '', REDIRECT_URI);

      return true;
    }

    async function exchangeCodeForToken(code, verifier) {
      const body = new URLSearchParams({
        client_id: SPOTIFY_CLIENT_ID,
        grant_type: 'authorization_code',
        code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      });

      const res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body
      });

      const text = await res.text();

      if (!res.ok) {
        console.error('[Spotify Status] Token exchange failed:', res.status, text);
        throw new Error(`Token exchange failed: HTTP ${res.status}`);
      }

      const json = JSON.parse(text);

      saveAuth({
        access_token: json.access_token,
        refresh_token: json.refresh_token,
        expires_at: Date.now() + Math.max(0, json.expires_in - 60) * 1000,
        scope: json.scope || SPOTIFY_SCOPES
      });

      sessionStorage.removeItem(VERIFIER_KEY);
      sessionStorage.removeItem(STATE_KEY);
    }

    async function refreshAccessToken() {
      const auth = getAuth();

      if (!auth?.refresh_token) {
        throw new Error('No refresh token available');
      }

      const body = new URLSearchParams({
        client_id: SPOTIFY_CLIENT_ID,
        grant_type: 'refresh_token',
        refresh_token: auth.refresh_token
      });

      const res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body
      });

      const text = await res.text();

      if (!res.ok) {
        console.error('[Spotify Status] Refresh failed:', res.status, text);
        clearAuth();
        throw new Error(`Refresh failed: HTTP ${res.status}`);
      }

      const json = JSON.parse(text);

      const next = {
        access_token: json.access_token,
        refresh_token: json.refresh_token || auth.refresh_token,
        expires_at: Date.now() + Math.max(0, json.expires_in - 60) * 1000,
        scope: json.scope || auth.scope || SPOTIFY_SCOPES
      };

      saveAuth(next);

      return next.access_token;
    }

    async function getValidAccessToken() {
      const auth = getAuth();

      if (!auth?.access_token) {
        throw new Error('Not authenticated. No access token in localStorage.');
      }

      if (Date.now() < auth.expires_at) {
        return auth.access_token;
      }

      return refreshAccessToken();
    }

    /******************************************************************
     * SPOTIFY API
     ******************************************************************/

    async function spotifyFetch(path, options = {}) {
      const token = await getValidAccessToken();

      const res = await fetch(`https://api.spotify.com/v1${path}`, {
        ...options,
        headers: {
          Authorization: `Bearer ${token}`,
          ...(options.headers || {})
        }
      });

      if (res.status === 204) {
        return null;
      }

      if (res.status === 401) {
        await refreshAccessToken();

        const retryToken = await getValidAccessToken();

        const retry = await fetch(`https://api.spotify.com/v1${path}`, {
          ...options,
          headers: {
            Authorization: `Bearer ${retryToken}`,
            ...(options.headers || {})
          }
        });

        if (retry.status === 204) {
          return null;
        }

        if (!retry.ok) {
          const text = await retry.text();
          console.error('[Spotify Status] Spotify API retry failed:', retry.status, text);
          throw new Error(`Spotify API retry failed: HTTP ${retry.status}`);
        }

        return retry.json();
      }

      if (!res.ok) {
        const text = await res.text();
        console.error('[Spotify Status] Spotify API failed:', path, res.status, text);
        throw new Error(`Spotify API error for ${path}: HTTP ${res.status}`);
      }

      return res.json();
    }

    async function verifyProfile() {
      const profile = await spotifyFetch('/me');

      setStatus('Connected');
      setSubtitle(`Logged in as ${profile.display_name || profile.id}`);

      return profile;
    }

    async function fetchPlaybackStatus() {
      let playback = null;

      try {
        playback = await spotifyFetch('/me/player');
      } catch (err) {
        console.warn('[Spotify Status] /me/player failed:', err.message);
      }

      if (playback?.item) {
        renderPlayback(playback, 'me/player');
        return;
      }

      let currentlyPlaying = null;

      try {
        currentlyPlaying = await spotifyFetch('/me/player/currently-playing');
      } catch (err) {
        console.warn('[Spotify Status] /me/player/currently-playing failed:', err.message);
      }

      if (currentlyPlaying?.item) {
        renderPlayback(currentlyPlaying, 'currently-playing');
        return;
      }

      renderIdle();
    }

    /******************************************************************
     * RENDER
     ******************************************************************/

    function formatMs(ms) {
      const totalSeconds = Math.max(0, Math.floor((ms || 0) / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = String(totalSeconds % 60).padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function updateProgressUi(pos, dur) {
      const safeDur = Math.max(0, dur || 0);
      const safePos = Math.max(0, Math.min(pos || 0, safeDur || 0));

      els.currentTime.textContent = formatMs(safePos);
      els.durationTime.textContent = formatMs(safeDur);
      els.progress.max = String(Math.max(1, safeDur));
      els.progress.value = String(safePos);
    }

    function renderIdle() {
      isPlaying = false;
      progressBase = 0;
      progressDuration = 0;
      progressStartedAt = Date.now();

      els.cover.src = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
      els.cover.classList.remove('ready');

      els.stateLine.textContent = 'No active playback';
      els.title.textContent = 'Nothing playing';
      els.artist.textContent = 'Open Spotify and play a song on any device.';
      els.album.textContent = '';

      updateProgressUi(0, 0);

      setStatus('Idle');
      setSubtitle('Connected, but Spotify returned no active playback');
    }

    function renderPlayback(data, source) {
      const item = data.item;

      if (!item) {
        renderIdle();
        return;
      }

      const artists = Array.isArray(item.artists)
        ? item.artists.map((a) => a.name).join(', ')
        : 'Unknown artist';

      const album = item.album?.name || '';
      const image = item.album?.images?.[0]?.url || '';

      isPlaying = !!data.is_playing;
      progressBase = data.progress_ms || 0;
      progressDuration = item.duration_ms || 0;
      progressStartedAt = Date.now();

      els.stateLine.textContent = isPlaying ? 'Now playing' : 'Paused';
      els.title.textContent = item.name || 'Unknown track';
      els.artist.textContent = artists;
      els.album.textContent = album ? `Album: ${album}` : '';

      if (image) {
        els.cover.src = image;
        els.cover.classList.add('ready');
      } else {
        els.cover.src = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
        els.cover.classList.remove('ready');
      }

      updateProgressUi(progressBase, progressDuration);

      setStatus(isPlaying ? 'Playing' : 'Paused');
      setSubtitle(`Synced by ${source}`);
    }

    function startTicker() {
      if (tickerTimer) {
        clearInterval(tickerTimer);
      }

      tickerTimer = setInterval(() => {
        if (!isPlaying) return;

        const estimatedPosition = progressBase + (Date.now() - progressStartedAt);
        updateProgressUi(estimatedPosition, progressDuration);
      }, 250);
    }

    function startPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
      }

      pollTimer = setInterval(() => {
        fetchPlaybackStatus().catch((err) => {
          console.warn('[Spotify Status] Polling failed:', err.message);
          setStatus('Poll error');
          setSubtitle(err.message);
        });
      }, 5000);
    }

    function showLoggedInButtons() {
      els.loginBtn.style.display = 'none';
      els.refreshBtn.style.display = 'inline-flex';
      els.logoutBtn.style.display = 'inline-flex';
    }

    function showLoggedOutButtons() {
      els.loginBtn.style.display = 'inline-flex';
      els.refreshBtn.style.display = 'none';
      els.logoutBtn.style.display = 'none';
    }

    /******************************************************************
     * EVENTS
     ******************************************************************/

    els.loginBtn.addEventListener('click', () => {
      loginSpotify().catch((err) => {
        console.error('[Spotify Status] Login failed:', err);
        setStatus('Login failed');
        setSubtitle(err.message);
      });
    });

    els.refreshBtn.addEventListener('click', () => {
      fetchPlaybackStatus().catch((err) => {
        console.error('[Spotify Status] Manual refresh failed:', err);
        setStatus('Refresh failed');
        setSubtitle(err.message);
      });
    });

    els.logoutBtn.addEventListener('click', () => {
      clearAuth();
      location.href = REDIRECT_URI;
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && getAuth()) {
        fetchPlaybackStatus().catch((err) => {
          console.warn('[Spotify Status] Visibility refresh failed:', err.message);
        });
      }
    });

    window.addEventListener('focus', () => {
      if (getAuth()) {
        fetchPlaybackStatus().catch((err) => {
          console.warn('[Spotify Status] Focus refresh failed:', err.message);
        });
      }
    });

    /******************************************************************
     * INIT
     ******************************************************************/

    (async function init() {
      try {
        setStatus('Checking auth');
        setSubtitle('Checking Spotify login state');

        await handleAuthCallback();

        const auth = getAuth();

        if (!auth?.access_token) {
          showLoggedOutButtons();

          setStatus('Not connected');
          setSubtitle('Connect Spotify to view current playback');

          els.stateLine.textContent = 'Not connected';
          els.title.textContent = 'Nothing playing';
          els.artist.textContent = 'Click Connect first.';
          els.album.textContent = '';

          updateProgressUi(0, 0);
          return;
        }

        showLoggedInButtons();

        await verifyProfile();
        await fetchPlaybackStatus();

        startTicker();
        startPolling();
      } catch (err) {
        console.error('[Spotify Status] Init failed:', err);

        showLoggedOutButtons();

        setStatus('Init failed');
        setSubtitle(err.message || 'Check console');

        els.stateLine.textContent = 'Error';
        els.title.textContent = 'Failed to initialize';
        els.artist.textContent = err.message || 'Check console.';
        els.album.textContent = '';
      }
    })();
  </script>
</body>
</html>
