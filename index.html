<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Status</title>
  <style>
    :root {
      --bg: rgba(182, 220, 255, 0.92);
      --line: rgba(255, 255, 255, 0.34);
      --text: rgba(53, 73, 92, 0.98);
      --muted: rgba(79, 96, 114, 0.82);
      --accent: #1ed760;
      --btn: rgba(86, 156, 234, 0.82);
      --btn-hover: rgba(68, 138, 220, 0.95);
      --shadow: 0 10px 24px rgba(0, 0, 0, 0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: "Segoe UI", "Inter", Arial, sans-serif;
      background: transparent; color: var(--text);
    }

    body { padding: 12px; }

    .spotify-app {
      position: relative; width: 100%; height: 100%;
      background: var(--bg); border: 1px solid var(--line);
      border-radius: 28px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; padding: 14px; gap: 10px;
    }

    /* Topbar Styles */
    .topbar { display: flex; align-items: center; justify-content: space-between; min-height: 42px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark { width: 30px; height: 30px; border-radius: 999px; background: var(--accent); position: relative; }
    .brand-mark span { position: absolute; left: 18%; right: 18%; height: 8%; border-radius: 999px; background: white; }
    .brand-mark span:nth-child(1) { top: 28%; transform: rotate(8deg); }
    .brand-mark span:nth-child(2) { top: 43%; transform: rotate(8deg); opacity: 0.88; }
    .brand-mark span:nth-child(3) { top: 57%; transform: rotate(8deg); opacity: 0.78; }
    .brand-title { font-size: 15px; font-weight: 700; }
    .brand-subtitle { font-size: 11px; color: var(--muted); margin-top: 3px; }

    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .status-pill { padding: 0 10px; height: 30px; border-radius: 999px; background: rgba(255,255,255,0.24); font-size: 11px; color: var(--muted); display: flex; align-items: center; }
    .btn { height: 34px; padding: 0 12px; border: none; border-radius: 11px; background: var(--btn); color: white; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.15s; }
    .btn:hover { background: var(--btn-hover); transform: translateY(-1px); }
    .btn.ghost { background: rgba(255, 255, 255, 0.22); color: var(--text); }

    /* Main Display Styles */
    .spotify-body {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: rgba(231, 242, 255, 0.70); border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 22px; padding: 20px;
    }

    .now-playing-container { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; }
    .cover-art { width: 180px; height: 180px; border-radius: 20px; box-shadow: 0 12px 28px rgba(0,0,0,0.12); object-fit: cover; opacity: 0; transition: opacity 0.3s ease; }
    .cover-art.ready { opacity: 1; }
    .now-title { font-size: 18px; font-weight: 800; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .now-artist { margin-top: 6px; font-size: 13px; color: var(--muted); }

    .progress-wrap { width: 100%; margin-top: 8px; }
    .progress-row { display: flex; align-items: center; gap: 12px; }
    .time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 32px; }
    input[type="range"] { -webkit-appearance: none; flex: 1; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.4); pointer-events: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 999px; background: rgba(68, 138, 220, 1); border: none; }
  </style>
</head>
<body>
  <div class="spotify-app">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark"><span></span><span></span><span></span></div>
        <div class="brand-copy">
          <div class="brand-title">Spotify Status</div>
          <div class="brand-subtitle" id="brand-subtitle">Connect to view playback</div>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="status-pill" id="spotify-status">Not connected</div>
        <button class="btn" id="spotify-login">Connect</button>
        <button class="btn ghost" id="spotify-logout" style="display: none;">Logout</button>
      </div>
    </div>

    <div class="spotify-body">
      <div class="now-playing-container">
        <img id="cover-art" class="cover-art" alt="Cover" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" />
        <div class="track-info">
          <div class="now-title" id="now-title">Nothing playing</div>
          <div class="now-artist" id="now-artist">Play music on any device to see it here.</div>
        </div>
        <div class="progress-wrap">
          <div class="progress-row">
            <div class="time" id="current-time">0:00</div>
            <input type="range" id="progress-bar" min="0" max="1000" value="0" readonly />
            <div class="time" id="duration-time">0:00</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script>
    const SPOTIFY_CLIENT_ID = 'ebf76017bcc54b1aaca01ed3fa4c161d';
    const REDIRECT_URI = 'https://billylu24.github.io/spotifypageGIAOK/';
    // 恢复了 SDK 所需的完整权限范围
    const SPOTIFY_SCOPES = [
      'streaming', 'user-read-email', 'user-read-private',
      'user-read-playback-state', 'user-read-currently-playing'
    ].join(' ');

    const AUTH_KEY = 'p3r_spotify_auth_v1';
    const VERIFIER_KEY = 'p3r_spotify_verifier_v1';
    const STATE_KEY = 'p3r_spotify_state_v1';

    const els = {
      status: document.getElementById('spotify-status'),
      subtitle: document.getElementById('brand-subtitle'),
      loginBtn: document.getElementById('spotify-login'),
      logoutBtn: document.getElementById('spotify-logout'),
      cover: document.getElementById('cover-art'),
      title: document.getElementById('now-title'),
      artist: document.getElementById('now-artist'),
      progress: document.getElementById('progress-bar'),
      curTime: document.getElementById('current-time'),
      durTime: document.getElementById('duration-time')
    };

    let spotifyPlayer = null;
    let ticking = null;
    let isPlaying = false;
    let progressBase = 0;
    let progressDuration = 0;
    let tickingStartedAt = 0;
    let fallbackPoll = null;

    // --- Utils ---
    const formatMs = (ms) => {
      const t = Math.max(0, Math.floor(ms / 1000));
      return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
    };

    // --- Auth Logic ---
    const getAuth = () => { try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch { return null; } };
    const saveAuth = (d) => localStorage.setItem(AUTH_KEY, JSON.stringify(d));
    const clearAuth = () => { localStorage.removeItem(AUTH_KEY); location.reload(); };

    async function sha256(plain) {
      const data = new TextEncoder().encode(plain);
      return crypto.subtle.digest('SHA-256', data);
    }
    const base64UrlEncode = (ab) => btoa(String.fromCharCode(...new Uint8Array(ab))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');

    async function loginSpotify() {
      const verifier = Array.from(crypto.getRandomValues(new Uint8Array(64))).map(b=>'abcdefghijklmnopqrstuvwxyz0123456789'[b%36]).join('');
      sessionStorage.setItem(VERIFIER_KEY, verifier);
      sessionStorage.setItem(STATE_KEY, verifier.slice(0,24));

      const authUrl = new URL('https://accounts.spotify.com/authorize');
      authUrl.search = new URLSearchParams({
        client_id: SPOTIFY_CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT_URI,
        code_challenge_method: 'S256', code_challenge: base64UrlEncode(await sha256(verifier)),
        scope: SPOTIFY_SCOPES, state: verifier.slice(0,24)
      }).toString();
      window.location.href = authUrl.toString();
    }

    async function exchangeToken(code) {
      const res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ client_id: SPOTIFY_CLIENT_ID, grant_type: 'authorization_code', code, redirect_uri: REDIRECT_URI, code_verifier: sessionStorage.getItem(VERIFIER_KEY) })
      });
      if (!res.ok) throw new Error('Token error');
      const json = await res.json();
      saveAuth({ access_token: json.access_token, refresh_token: json.refresh_token, expires_at: Date.now() + (json.expires_in - 60) * 1000 });
    }

    async function getValidToken() {
      const auth = getAuth();
      if (!auth) throw new Error('No auth');
      if (Date.now() < auth.expires_at) return auth.access_token;
      const res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ client_id: SPOTIFY_CLIENT_ID, grant_type: 'refresh_token', refresh_token: auth.refresh_token })
      });
      const json = await res.json();
      saveAuth({ access_token: json.access_token, refresh_token: json.refresh_token || auth.refresh_token, expires_at: Date.now() + (json.expires_in - 60) * 1000 });
      return json.access_token;
    }

    // --- UI Updaters ---
    function updateProgressUi(pos, dur) {
      els.curTime.textContent = formatMs(pos);
      els.durTime.textContent = formatMs(dur);
      els.progress.max = Math.max(1, dur);
      els.progress.value = pos;
    }

    function startTicker() {
      if (ticking) clearInterval(ticking);
      ticking = setInterval(() => {
        if (!isPlaying) return;
        updateProgressUi(progressBase + (Date.now() - tickingStartedAt), progressDuration);
      }, 250);
    }

    function renderTrack(trackData, paused, pos) {
      if (!trackData) return;
      els.title.textContent = trackData.name;
      els.artist.textContent = trackData.artists.map(a => a.name).join(', ');
      const img = trackData.album?.images?.[0]?.url || trackData.image;
      if (img && els.cover.src !== img) {
        els.cover.src = img;
        els.cover.classList.add('ready');
      }

      isPlaying = !paused;
      progressBase = pos || 0;
      progressDuration = trackData.duration_ms || 0;
      tickingStartedAt = Date.now();

      updateProgressUi(progressBase, progressDuration);
      els.status.textContent = isPlaying ? 'Playing' : 'Paused';
      els.subtitle.textContent = `Synced to Spotify`;
    }

    // --- Global Polling (Fallback for other devices) ---
    async function syncGlobalPlayback() {
      try {
        const token = await getValidToken();
        const res = await fetch('https://api.spotify.com/v1$/me/player', { headers: { Authorization: `Bearer ${token}` } });
        if (res.status === 204) return;
        const data = await res.json();
        // 如果当前设备是通过 SDK 激活的，我们跳过轮询更新，完全交给 WebSockets 处理，防止画面闪烁
        if (data.device && data.device.name === 'Spotify Status Panel') return;

        if (data.item) renderTrack(data.item, !data.is_playing, data.progress_ms);
      } catch (e) { /* ignore polling errors */ }
    }

    // --- SDK Initialization ---
    window.onSpotifyWebPlaybackSDKReady = () => {
      spotifyPlayer = new Spotify.Player({
        name: 'Spotify Status Panel',
        getOAuthToken: cb => { getValidToken().then(cb).catch(console.error); },
        volume: 0.8
      });

      spotifyPlayer.addListener('ready', () => console.log('SDK Ready'));

      spotifyPlayer.addListener('player_state_changed', state => {
        if (!state) return;
        const track = state.track_window.current_track;
        if (track) {
          // SDK 传回的数据结构略有不同，我们做一下适配
          track.image = track.album.images[0].url;
          renderTrack(track, state.paused, state.position);
        }
      });

      spotifyPlayer.connect();
    };

    // --- Init ---
    els.loginBtn.addEventListener('click', loginSpotify);
    els.logoutBtn.addEventListener('click', clearAuth);

    (async () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('code')) {
        await exchangeToken(params.get('code'));
        history.replaceState({}, '', REDIRECT_URI);
      }

      const auth = getAuth();
      if (!auth) {
        els.status.textContent = 'Not connected';
        return;
      }

      els.loginBtn.style.display = 'none';
      els.logoutBtn.style.display = 'block';
      els.status.textContent = 'Connecting...';

      // Initial state fetch & start systems
      await syncGlobalPlayback();
      startTicker();
      fallbackPoll = setInterval(syncGlobalPlayback, 2500); // 2.5s 兜底刷新
    })();
  </script>
</body>
</html>
